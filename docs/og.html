<!doctype html><meta charset="utf-8"><title>Tessera</title>
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1280px;height:640px;overflow:hidden;position:relative;background:#0c0c0f;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:#f2f2f0}
.glow{position:absolute;inset:0;background:radial-gradient(60% 80% at 82% 55%,rgba(255,107,74,.30),transparent 70%),radial-gradient(40% 50% at 8% 100%,rgba(255,107,74,.16),transparent 70%),linear-gradient(135deg,#131318,#08080a)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(90deg,#000,transparent 70%)}
.left{position:absolute;left:72px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:22px}
.brand img{width:92px;height:92px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
h1{margin:0;font-size:92px;font-weight:650;letter-spacing:-.035em;line-height:1}
.tag{margin:26px 0 0;font-size:34px;line-height:1.25;font-weight:400;color:#e4e4e2;letter-spacing:-.01em}
.tag b{color:#ff6b4a;font-weight:600}
.pills{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.pill{padding:11px 20px;border-radius:999px;font-size:21px;font-weight:600;letter-spacing:.01em;border:1.5px solid rgba(255,255,255,.18);color:#f2f2f0;background:rgba(255,255,255,.05)}
.pill.hot{background:#ff6b4a;border-color:#ff6b4a;color:#1d1d22}
.fine{margin-top:26px;font-size:20px;color:#9d9da6}
.shots img{position:absolute;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.10)}
.s1{width:560px;left:690px;top:76px;transform:rotate(-3deg)}
.s2{width:230px;left:1030px;top:210px;transform:rotate(4deg)}
.s3{width:300px;left:668px;top:430px;transform:rotate(-1.5deg)}
</style>
<div class="glow"></div><div class="grid"></div>
<div class="left">
  <div class="brand"><img src="../src/logo.svg" alt=""><h1>Tessera</h1></div>
  <p class="tag">Right-click any file.<br>Pick a format. <b>Done.</b></p>
  <div class="pills"><span class="pill hot">100% FREE</span><span class="pill">MODERN INTERFACE</span><span class="pill">OPEN SOURCE</span></div>
  <div class="fine">Images · Audio · Video · PDF &nbsp;|&nbsp; No account, no ads, no telemetry</div>
</div>
<div class="shots">
  <img class="s1" src="img/settings-formats.png" alt="">
  <img class="s2" src="img/chooser.png" alt="">
  <img class="s3" src="img/progress.png" alt="">
</div>
