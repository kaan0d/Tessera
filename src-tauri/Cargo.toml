[package]
name = "new-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "new_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "avif"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4"] }
hound = "3"
flacenc = "0.5"
trash = "5"
ureq = "3"
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
hayro = "0.8"
pdf-writer = "0.15"
kamadak-exif = "0.6"
miniz_oxide = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"

