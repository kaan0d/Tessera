[package]
name = "donusturx"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "donusturx_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4"] }
hound = "3"
flacenc = "0.5"
thiserror = "2"
trash = "5"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
