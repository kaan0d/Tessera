<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera</title>
<link rel="stylesheet" href="capture.css">
<script src="i18n.js" defer></script>
<script src="lang/es.js" defer></script>
<script src="lang/zh-CN.js" defer></script>
<script src="lang/pt-BR.js" defer></script>
<script src="lang/ru.js" defer></script>
<script src="lang/de.js" defer></script>
<script src="lang/fr.js" defer></script>
<script src="lang/ja.js" defer></script>
<script src="lang/ko.js" defer></script>
<script src="lang/it.js" defer></script>
<script src="lang/id.js" defer></script>
<script src="capture-bar.js" defer></script>
</head>
<body class="barpage">
<div class="bar" role="region" data-i18n-attr="aria-label:cap.rec">
  <span class="dot" aria-hidden="true"></span>
  <span class="rec" data-i18n="cap.rec"></span>
  <span id="time" class="time" role="timer">00:00</span>
  <button type="button" id="stop" class="b stop" data-i18n="cap.stop"></button>
  <button type="button" id="cancel" class="b" data-i18n="cap.cancel"></button>
</div>
</body>
</html>
