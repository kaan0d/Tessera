<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tessera</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="summary.js" defer></script>
<script src="drop.js" defer></script>
<script src="custom.js" defer></script>
</head>
<body class="drop">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17.5 5-4.5 4 3.5 2.5-2 4.5 3.5"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 17.5V6.5l10-2v11"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z"/><path d="M13.5 3.5V8H18M9 13h6M9 16.5h4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24"><path d="m4.5 19.5 10-10"/><path d="m12.5 7.5 4 4"/><path d="M17.5 3v3M16 4.5h3M20 9.5v2M19 10.5h2M8.5 3.5v2M7.5 4.5h2"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M4.5 6.5h4l4 5.5-4 5.5h-4"/><path d="M12.5 12h7m-3-3 3 3-3 3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.6a2 2 0 0 1 3.4 0l7.2 12.6a2 2 0 0 1-1.7 3H4.8a2 2 0 0 1-1.7-3z"/><path d="M12 9.5v4"/><path d="M12 16.8v.2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13.5 6.5 19 12l-5.5 5.5"/></symbol>
</svg>

<main class="dr" id="dr">
  <header class="dr-head">
    <div id="dr-stack" class="dr-stack" aria-hidden="true"></div>
    <div class="grow">
      <h1 id="dr-title" class="dr-title"></h1>
      <p id="dr-names" class="dr-names"></p>
    </div>
  </header>
  <p id="dr-skip" class="dr-skip" role="note" hidden><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg><span id="dr-skip-text"></span></p>

  <div id="dr-body" class="dr-body">
    <div id="dr-main">
    <h2 class="dr-q" data-i18n="dr.question"></h2>
    <section id="sec-convert" class="dr-sec" aria-labelledby="h-convert" hidden>
      <h3 id="h-convert" class="dr-sec-title" data-i18n="dr.convert"></h3>
      <div id="dr-targets" class="dr-kinds"></div>
      <p id="dr-tnote" class="dr-note" hidden></p>
    </section>
    <section id="sec-presets" class="dr-sec" aria-labelledby="h-presets" hidden>
      <h3 id="h-presets" class="dr-sec-title" data-i18n="dr.presets"></h3>
      <div id="dr-presets" class="dr-cards"></div>
    </section>
    <section id="sec-merge" class="dr-sec" aria-labelledby="h-merge" hidden>
      <h3 id="h-merge" class="dr-sec-title" data-i18n="dr.merge"></h3>
      <div id="dr-merge" class="dr-cards"></div>
    </section>
    <section id="sec-custom" class="dr-sec" aria-labelledby="h-custom" hidden>
      <h3 id="h-custom" class="dr-sec-title" data-i18n="dr.custom"></h3>
      <div id="dr-customcard" class="dr-cards"></div>
    </section>
    <p id="dr-empty" class="dr-note" hidden></p>
    </div>
    <form id="dr-custom" class="dr-custom" hidden autocomplete="off"></form>
  </div>

  <footer class="dr-foot">
    <p id="dr-status" class="dr-status" role="status" aria-live="polite"></p>
    <button type="button" id="dr-back" class="btn sm ghost" hidden><span data-i18n="dr.back"></span></button>
    <button type="button" id="dr-run" class="btn sm primary" hidden><span data-i18n="dr.run"></span></button>
    <button type="button" id="dr-back" class="btn sm ghost" hidden><span data-i18n="dr.back"></span></button>
    <button type="button" id="dr-run" class="btn sm primary" hidden><span data-i18n="dr.run"></span></button>
    <button type="button" id="dr-cancel" class="btn sm ghost"><span data-i18n="dr.cancel"></span><kbd data-i18n="dr.esc"></kbd></button>
  </footer>
</main>

<!-- more files dragged onto the chooser replace the current ones -->
<div id="dz" class="dropzone" aria-hidden="true">
  <div class="dz-frame">
    <p class="dz-title" data-i18n="dz.title"></p>
    <p class="dz-sub" data-i18n="dr.dz_sub"></p>
  </div>
</div>
</body>
</html>
