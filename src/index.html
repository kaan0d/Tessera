<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>new-app</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="settings">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v7.5"/><path d="M7.2 6.6a7.5 7.5 0 1 0 9.6 0"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2.2h7.4a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-files" viewBox="0 0 24 24"><rect x="8" y="3.5" width="12" height="13" rx="2"/><path d="M16 20.5H6a2 2 0 0 1-2-2V8"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17.5 5-4.5 4 3.5 2.5-2 4.5 3.5"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 17.5V6.5l10-2v11"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 18.5 8.5 6l4.5 12.5M5.6 14h5.8"/><path d="M15.5 10.5c.6-.8 1.5-1.2 2.5-1.2 1.7 0 2.5 1 2.5 2.6v6.6M20.5 14.5c-3.5 0-5.5.8-5.5 2.4 0 1 .8 1.6 1.9 1.6 1.9 0 3.6-1.4 3.6-4"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="13" rx="2.5"/><rect x="12.5" y="7.5" width="5.5" height="3.5" rx="1"/><path d="M9 20.5h6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M5 7h9M5 12h6M5 17h3"/><path d="M17.5 5v14m0 0-3-3m3 3 3-3"/></symbol>
  <symbol id="i-shapes" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><circle cx="16.5" cy="7.5" r="3.5"/><path d="m7.5 13.5 4 6.5h-8z"/><rect x="13" y="13" width="7" height="7" rx="3.5"/></symbol>
  <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M5 4.5 18.5 10l-5.8 1.9-2 5.9z"/><path d="m13 12.2 5 5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2 8.8-9.2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.6a2 2 0 0 1 3.4 0l7.2 12.6a2 2 0 0 1-1.7 3H4.8a2 2 0 0 1-1.7-3z"/><path d="M12 9.5v4"/><path d="M12 16.8v.2"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
</svg>

<header class="top">
  <div class="top-row">
    <!-- placeholder brand mark: swap this svg when the real logo exists -->
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="mark-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="mark-a"/><stop offset="1" class="mark-b"/></linearGradient>
        <clipPath id="mark-c"><path d="M14 8.5h9.5l5.5 5.5v16a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2v-19.5a2 2 0 0 1 2-2z"/></clipPath>
      </defs>
      <rect width="40" height="40" rx="11" fill="url(#mark-g)"/>
      <path class="mark-sheet" d="M14 8.5h9.5l5.5 5.5v16a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2v-19.5a2 2 0 0 1 2-2z"/>
      <rect class="mark-ink" x="10" y="20.5" width="22" height="13" clip-path="url(#mark-c)"/>
      <path class="mark-fold" d="M23.5 8.5V12a2 2 0 0 0 2 2H29"/>
    </svg>
    <div class="brand">
      <h1 id="app-title"></h1>
      <p class="sub" data-i18n="app.settings"></p>
    </div>
    <span id="saved" class="saved" role="status" aria-live="polite"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span id="saved-text" data-i18n="saved"></span></span>
  </div>
  <nav id="tabs" class="tabs seg" role="tablist" data-i18n-attr="aria-label:tabs.label">
    <span class="seg-thumb" aria-hidden="true"></span>
    <button type="button" role="tab" id="t-genel" data-i18n="tab.general" aria-controls="p-genel" aria-selected="true"></button>
    <button type="button" role="tab" id="t-bicim" data-i18n="tab.formats" aria-controls="p-bicim" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="t-cikti" data-i18n="tab.output" aria-controls="p-cikti" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="t-kalite" data-i18n="tab.quality" aria-controls="p-kalite" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="t-panel" data-i18n="tab.panel" aria-controls="p-panel" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="t-menu" data-i18n="tab.menu" aria-controls="p-menu" aria-selected="false" tabindex="-1"></button>
    <button type="button" role="tab" id="t-ileri" data-i18n="tab.advanced" aria-controls="p-ileri" aria-selected="false" tabindex="-1"></button>
  </nav>
</header>

<main>
  <p id="error" class="banner err" role="alert" hidden></p>

  <section id="ff-notice" class="notice" aria-labelledby="h-notice" hidden>
    <span class="tile accent"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></span>
    <div class="grow">
      <h2 id="h-notice" data-i18n="ffn.title"></h2>
      <p data-i18n="ffn.body"></p>
      <button type="button" id="ff-notice-ok" class="btn primary sm" data-i18n="ffn.ok"></button>
    </div>
  </section>

  <!-- General -->
  <section id="p-genel" class="pane on" role="tabpanel" aria-labelledby="t-genel" tabindex="-1">
    <div class="card">
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg></span>
        <div class="grow">
          <span id="l-lang" class="label" data-i18n="lang.label"></span>
          <p class="desc" data-i18n="lang.desc"></p>
        </div>
        <div class="seg seg-sm" role="radiogroup" aria-labelledby="l-lang">
          <span class="seg-thumb" aria-hidden="true"></span>
          <label><input type="radio" name="lang" value="en"><span lang="en">English</span></label>
          <label><input type="radio" name="lang" value="tr"><span lang="tr">Türkçe</span></label>
        </div>
      </div>
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-power"/></svg></span>
        <div class="grow">
          <label for="autostart" class="label" data-i18n="autostart.label"></label>
          <p class="desc" id="d-autostart" data-i18n="autostart.desc"></p>
        </div>
        <input type="checkbox" id="autostart" class="switch" role="switch" aria-describedby="d-autostart">
      </div>
    </div>
    <p class="aside" data-i18n-html="general.aside"></p>
  </section>

  <!-- Formats -->
  <section id="p-bicim" class="pane" role="tabpanel" aria-labelledby="t-bicim" tabindex="-1" hidden>
    <div class="group">
      <h2 class="group-title" id="h-targets" data-i18n="fmt.targets"></h2>
      <div class="card">
        <div id="targets" class="kinds" aria-labelledby="h-targets"></div>
        <p id="t-hint" class="foot hint" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div class="group">
      <h2 class="group-title" id="h-sources" data-i18n="fmt.sources"></h2>
      <div class="card">
        <div id="sources" class="kinds" aria-labelledby="h-sources"></div>
        <p id="s-hint" class="foot hint" role="status" aria-live="polite"></p>
      </div>
    </div>
    <p id="cat-err" class="banner err" role="alert" hidden></p>
  </section>

  <!-- Output -->
  <section id="p-cikti" class="pane" role="tabpanel" aria-labelledby="t-cikti" tabindex="-1" hidden>
    <div class="card">
      <div class="row top-align">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg></span>
        <div class="grow">
          <label for="tpl" class="label" data-i18n="out.name"></label>
          <p class="desc" id="d-tpl" data-i18n="out.name_desc"></p>
          <input type="text" id="tpl" class="field" spellcheck="false" autocomplete="off" maxlength="100" aria-describedby="d-tpl tpl-msg tpl-ex">
          <div class="tokens" role="group" data-i18n-attr="aria-label:out.tags">
            <button type="button" class="token" data-token="{name}"><code>{name}</code><span data-i18n="tok.name"></span></button>
            <button type="button" class="token" data-token="{format}"><code>{format}</code><span data-i18n="tok.format"></span></button>
            <button type="button" class="token" data-token="{date}"><code>{date}</code><span data-i18n="tok.date"></span></button>
          </div>
          <p id="tpl-ex" class="example" aria-live="polite"><span class="ex-src" data-i18n="tpl.example_src"></span><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg><span id="tpl-out" class="ex-out"></span></p>
          <p id="tpl-msg" class="field-msg" role="alert"></p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row top-align" role="radiogroup" aria-labelledby="l-dir">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg></span>
        <div class="grow">
          <span id="l-dir" class="label" data-i18n="out.where"></span>
          <div class="choices">
            <label class="choice"><input type="radio" name="dir" value="same_as_source"><span data-i18n="out.same"></span></label>
            <div class="choice">
              <label><input type="radio" name="dir" value="fixed"><span data-i18n="out.fixed"></span></label>
              <button type="button" id="pick" class="btn sm" data-i18n="out.pick"></button>
            </div>
          </div>
          <p id="path" class="path" hidden></p>
        </div>
      </div>
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-files"/></svg></span>
        <div class="grow">
          <label for="conflict" class="label" data-i18n="out.conflict"></label>
        </div>
        <span class="select">
          <select id="conflict">
            <option value="auto_rename" data-i18n="out.opt_rename"></option>
            <option value="overwrite" data-i18n="out.opt_overwrite"></option>
            <option value="replace_original" data-i18n="out.opt_replace"></option>
          </select>
          <svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg>
        </span>
      </div>
      <p id="warn" class="banner warn inset" role="note" hidden><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg><span data-i18n="out.warn"></span></p>
    </div>
  </section>

  <!-- Quality -->
  <section id="p-kalite" class="pane" role="tabpanel" aria-labelledby="t-kalite" tabindex="-1" hidden>
    <div class="group">
      <h2 class="group-title" data-i18n="kind.image"></h2>
      <div class="card">
        <div class="row top-align">
          <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg></span>
          <div class="grow q">
            <div class="label-line"><label for="q-jpeg" class="label">JPEG</label><output for="q-jpeg" class="val"><span></span><small></small></output></div>
            <input type="range" id="q-jpeg" class="slider" data-q="jpeg" min="1" max="100" step="1">
            <p class="desc scale" aria-hidden="true"><span data-i18n="q.small"></span><span data-i18n="q.high"></span></p>
          </div>
        </div>
      </div>
    </div>
    <div class="group">
      <h2 class="group-title" data-i18n="kind.audio"></h2>
      <div class="card">
        <div class="row top-align">
          <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-audio"/></svg></span>
          <div class="grow">
            <div class="q">
              <div class="label-line"><label for="q-mp3" class="label">MP3</label><output for="q-mp3" class="val"><span></span><small></small></output></div>
              <input type="range" id="q-mp3" class="slider" data-q="mp3_q" min="0" max="9" step="1">
            </div>
            <div class="q">
              <div class="label-line"><label for="q-ogg" class="label">OGG</label><output for="q-ogg" class="val"><span></span><small></small></output></div>
              <input type="range" id="q-ogg" class="slider" data-q="ogg_q" min="0" max="10" step="1">
            </div>
            <p class="desc scale" aria-hidden="true"><span data-i18n="q.small"></span><span data-i18n="q.high"></span></p>
          </div>
        </div>
        <p class="foot" data-i18n="q.audio_foot"></p>
      </div>
    </div>
    <div class="group">
      <h2 class="group-title" data-i18n="q.videogif"></h2>
      <div class="card">
        <div class="row top-align">
          <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-film"/></svg></span>
          <div class="grow q">
            <div class="label-line"><label for="q-video" class="label" data-i18n="q.video_rate"></label><output for="q-video" class="val"><span></span><small></small></output></div>
            <input type="range" id="q-video" class="slider" data-q="video_mbps" min="1" max="30" step="1">
            <p class="desc scale" aria-hidden="true"><span data-i18n="q.small"></span><span data-i18n="q.high"></span></p>
          </div>
        </div>
        <div class="row top-align">
          <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg></span>
          <div class="grow">
            <div class="q">
              <div class="label-line"><label for="q-fps" class="label" data-i18n="q.gif_fps"></label><output for="q-fps" class="val"><span></span><small></small></output></div>
              <input type="range" id="q-fps" class="slider" data-q="gif_fps" min="5" max="30" step="1">
            </div>
            <div class="q">
              <div class="label-line"><label for="q-width" class="label" data-i18n="q.gif_width"></label><output for="q-width" class="val"><span></span><small></small></output></div>
              <input type="range" id="q-width" class="slider" data-q="gif_width" min="120" max="1280" step="10">
            </div>
            <p class="desc" data-i18n="q.gif_desc"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Panel -->
  <section id="p-panel" class="pane" role="tabpanel" aria-labelledby="t-panel" tabindex="-1" hidden>
    <div class="card">
      <div class="stage-wrap">
        <div class="label-line">
          <span id="l-corner" class="label" data-i18n="pn.pos"></span>
          <button type="button" id="demo-play" class="btn sm play"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg><span data-i18n="pn.preview"></span></button>
        </div>
        <p class="desc" data-i18n="pn.pos_desc"></p>
        <div id="screen" class="screen" role="radiogroup" aria-labelledby="l-corner">
          <label class="corner" data-c="top_left"><input type="radio" name="corner" value="top_left" data-i18n-attr="aria-label:pn.top_left"><span class="slot"></span></label>
          <label class="corner" data-c="top_right"><input type="radio" name="corner" value="top_right" data-i18n-attr="aria-label:pn.top_right"><span class="slot"></span></label>
          <label class="corner" data-c="bottom_left"><input type="radio" name="corner" value="bottom_left" data-i18n-attr="aria-label:pn.bottom_left"><span class="slot"></span></label>
          <label class="corner" data-c="bottom_right"><input type="radio" name="corner" value="bottom_right" data-i18n-attr="aria-label:pn.bottom_right"><span class="slot"></span></label>
          <span class="taskbar" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
      <div class="row top-align">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg></span>
        <div class="grow q">
          <div class="label-line"><label for="q-secs" class="label" data-i18n="pn.stay"></label><output for="q-secs" class="val"><span></span><small></small></output></div>
          <input type="range" id="q-secs" class="slider" min="2" max="30" step="1">
          <p class="desc scale" aria-hidden="true"><span data-i18n="pn.stay_lo"></span><span data-i18n="pn.stay_hi"></span></p>
        </div>
      </div>
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg></span>
        <div class="grow">
          <label for="toast-sw" class="label" data-i18n="pn.toast"></label>
          <p class="desc" id="d-toast" data-i18n="pn.toast_desc"></p>
        </div>
        <input type="checkbox" id="toast-sw" class="switch" role="switch" aria-describedby="d-toast">
      </div>
    </div>
  </section>

  <!-- Menu -->
  <section id="p-menu" class="pane" role="tabpanel" aria-labelledby="t-menu" tabindex="-1" hidden>
    <div class="card">
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-shapes"/></svg></span>
        <div class="grow">
          <label for="icons-sw" class="label" data-i18n="mn.icons"></label>
          <p class="desc" id="d-icons" data-i18n="mn.icons_desc"></p>
        </div>
        <input type="checkbox" id="icons-sw" class="switch" role="switch" aria-describedby="d-icons">
      </div>
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-sort"/></svg></span>
        <div class="grow">
          <span id="l-sort" class="label" data-i18n="mn.sort"></span>
          <p class="desc" data-i18n="mn.sort_desc"></p>
        </div>
        <div class="seg seg-sm" role="radiogroup" aria-labelledby="l-sort">
          <span class="seg-thumb" aria-hidden="true"></span>
          <label><input type="radio" name="sort" value="default"><span data-i18n="mn.default"></span></label>
          <label><input type="radio" name="sort" value="alphabetical"><span>A-Z</span></label>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row top-align">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-pointer"/></svg></span>
        <div class="grow">
          <span class="label" data-i18n="mn.explorer"></span>
          <p class="desc" data-i18n="mn.explorer_desc"></p>
          <div class="actions">
            <button type="button" id="menu-add" class="btn primary sm" data-i18n="mn.reinstall"></button>
            <button type="button" id="menu-del" class="btn sm" data-i18n="mn.remove"></button>
          </div>
          <p id="toast" class="toast" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Advanced -->
  <section id="p-ileri" class="pane" role="tabpanel" aria-labelledby="t-ileri" tabindex="-1" hidden>
    <div class="group">
      <h2 class="group-title" data-i18n="adv.videoaudio"></h2>
      <div class="card">
        <div id="ff" class="row top-align ff" data-state="checking">
          <span class="tile ff-tile">
            <svg id="ff-sheet" class="sheet" viewBox="0 0 25 30" aria-hidden="true">
              <defs><clipPath id="ff-clip"><path d="M4 1h11.5L23 8.5V27a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z"/></clipPath></defs>
              <g clip-path="url(#ff-clip)"><g class="level"><path class="ink" d="M-24 0q3-2 6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0V40h-48z"/></g></g>
              <path class="outline" d="M4 1h11.5L23 8.5V27a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z"/>
              <path class="fold" d="M15.5 1v5.5a2 2 0 0 0 2 2H23"/>
              <path class="pict" d="M9 15.5v7l6-3.5z"/>
              <path class="mark-ok" pathLength="1" d="M7.5 18.5l3.2 3.2 6.8-7"/>
              <path class="mark-err" pathLength="1" d="M12.5 13.5v5.5M12.5 22.6v.2"/>
            </svg>
          </span>
          <div class="grow">
            <div class="label-line">
              <span class="label">ffmpeg</span>
              <span id="ff-pct" class="val" hidden></span>
            </div>
            <p id="ff-status" class="desc ff-status" role="status" data-i18n="ff.initial"></p>
            <div id="ff-bar" class="bar" role="progressbar" data-i18n-attr="aria-label:ff.bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><span></span></div>
            <button type="button" id="ff-retry" class="btn sm" hidden><svg class="ic" aria-hidden="true"><use href="#i-retry"/></svg><span data-i18n="ff.retry"></span></button>
          </div>
        </div>
        <p class="foot" data-i18n="ff.foot"></p>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="backdrop" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-text">
    <span class="tile danger"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg></span>
    <h2 id="m-title" data-i18n="modal.title"></h2>
    <p id="m-text" data-i18n="modal.text"></p>
    <div class="actions end">
      <button type="button" id="m-no" class="btn" data-i18n="modal.no"></button>
      <button type="button" id="m-yes" class="btn danger" data-i18n="modal.yes"></button>
    </div>
  </div>
</div>
</body>
</html>
