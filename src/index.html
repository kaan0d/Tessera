<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tessera</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="summary.js" defer></script>
<script src="app.js" defer></script>
<script src="features.js" defer></script>
</head>
<body class="settings">

  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M5 7h9M5 12h6M5 17h3"/><path d="M17.5 5v14m0 0-3-3m3 3 3-3"/></symbol>
  <symbol id="i-shapes" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><circle cx="16.5" cy="7.5" r="3.5"/><path d="m7.5 13.5 4 6.5h-8z"/><rect x="13" y="13" width="7" height="7" rx="3.5"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2 8.8-9.2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.6a2 2 0 0 1 3.4 0l7.2 12.6a2 2 0 0 1-1.7 3H4.8a2 2 0 0 1-1.7-3z"/><path d="M12 9.5v4"/><path d="M12 16.8v.2"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>

  <symbol id="i-history" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/><path d="M12 8v4l2.8 1.8"/></symbol>

  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="m7.5 9.5 3 2.5-3 2.5M12.5 15h4"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M4.5 6.5h4l4 5.5-4 5.5h-4"/><path d="M12.5 12h7m-3-3 3 3-3 3"/></symbol>

  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.3 3 7.8 7 9 4-1.2 7-4.7 7-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
</svg>

<div class="shell">
<aside class="side">
  <div class="brand-row">
    <svg class="mark-arch" viewBox="0 0 256 256" aria-hidden="true"><path class="st" d="M33 178.5H69A5 5 0 0 1 74 183.5V221.0A5 5 0 0 1 69 226.0H33A5 5 0 0 1 28 221.0V183.5A5 5 0 0 1 33 178.5Z"/><path class="st" d="M187 178.5H223A5 5 0 0 1 228 183.5V221.0A5 5 0 0 1 223 226.0H187A5 5 0 0 1 182 221.0V183.5A5 5 0 0 1 187 178.5Z"/><path class="st" d="M26 151.5H76A4 4 0 0 1 80 155.5V163.5A4 4 0 0 1 76 167.5H26A4 4 0 0 1 22 163.5V155.5A4 4 0 0 1 26 151.5Z"/><path class="st" d="M180 151.5H230A4 4 0 0 1 234 155.5V163.5A4 4 0 0 1 230 167.5H180A4 4 0 0 1 176 163.5V155.5A4 4 0 0 1 180 151.5Z"/><path class="st" d="M28.47 136.50A100.00 100.00 0 0 1 41.02 96.69A4 4 0 0 1 46.59 95.71L77.98 117.69A4 4 0 0 1 78.96 123.26A54.00 54.00 0 0 0 74.78 136.50A4 4 0 0 1 70.78 140.50L32.47 140.50A4 4 0 0 1 28.47 136.50Z"/><path class="st" d="M214.98 96.69A100.00 100.00 0 0 1 227.53 136.50A4 4 0 0 1 223.53 140.50L185.22 140.50A4 4 0 0 1 181.22 136.50A54.00 54.00 0 0 0 177.04 123.26A4 4 0 0 1 178.02 117.69L209.41 95.71A4 4 0 0 1 214.98 96.69Z"/><path class="st" d="M51.92 81.13A100.00 100.00 0 0 1 85.03 55.72A4 4 0 0 1 90.16 58.11L103.26 94.12A4 4 0 0 1 100.87 99.24A54.00 54.00 0 0 0 89.86 107.69A4 4 0 0 1 84.29 108.68L52.90 86.70A4 4 0 0 1 51.92 81.13Z"/><path class="st" d="M170.97 55.72A100.00 100.00 0 0 1 204.08 81.13A4 4 0 0 1 203.10 86.70L171.71 108.68A4 4 0 0 1 166.14 107.69A54.00 54.00 0 0 0 155.13 99.24A4 4 0 0 1 152.74 94.12L165.84 58.11A4 4 0 0 1 170.97 55.72Z"/><path class="key" d="M98.08 36.01A114.00 114.00 0 0 1 157.92 36.01A4 4 0 0 1 160.31 41.14L139.62 97.99A4 4 0 0 1 134.49 100.38A46.00 46.00 0 0 0 121.51 100.38A4 4 0 0 1 116.38 97.99L95.69 41.14A4 4 0 0 1 98.08 36.01Z"/></svg>
    <div class="brand">
      <h1 id="app-title"></h1>
      <p class="sub" data-i18n="app.settings"></p>
    </div>
  </div>
  <nav id="tabs" class="nav" role="tablist" aria-orientation="vertical" data-i18n-attr="aria-label:tabs.label">
    <span class="nav-thumb" aria-hidden="true"></span>
    <button type="button" role="tab" id="t-genel" aria-controls="p-genel" aria-selected="true" data-desc="desc.general"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span data-i18n="tab.general"></span></button>
    <p class="nav-group" role="presentation" data-i18n="navg.convert"></p>
    <button type="button" role="tab" id="t-bicim" aria-controls="p-bicim" aria-selected="false" tabindex="-1" data-desc="desc.formats"><svg class="ic" aria-hidden="true"><use href="#i-shapes"/></svg><span data-i18n="tab.formats"></span></button>
    <button type="button" role="tab" id="t-preset" aria-controls="p-preset" aria-selected="false" tabindex="-1" data-desc="desc.presets"><svg class="ic" aria-hidden="true"><use href="#i-wand"/></svg><span data-i18n="tab.presets"></span></button>
    <button type="button" role="tab" id="t-cikti" aria-controls="p-cikti" aria-selected="false" tabindex="-1" data-desc="desc.output"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg><span data-i18n="tab.output"></span></button>
    <button type="button" role="tab" id="t-kalite" aria-controls="p-kalite" aria-selected="false" tabindex="-1" data-desc="desc.quality"><svg class="ic" aria-hidden="true"><use href="#i-gauge"/></svg><span data-i18n="tab.quality"></span></button>
    <p class="nav-group" role="presentation" data-i18n="navg.desktop"></p>
    <button type="button" role="tab" id="t-panel" aria-controls="p-panel" aria-selected="false" tabindex="-1" data-desc="desc.panel"><svg class="ic" aria-hidden="true"><use href="#i-panel"/></svg><span data-i18n="tab.panel"></span></button>
    <button type="button" role="tab" id="t-menu" aria-controls="p-menu" aria-selected="false" tabindex="-1" data-desc="desc.menu"><svg class="ic" aria-hidden="true"><use href="#i-pointer"/></svg><span data-i18n="tab.menu"></span></button>
    <p class="nav-group" role="presentation" data-i18n="navg.auto"></p>
    <button type="button" role="tab" id="t-history" aria-controls="p-history" aria-selected="false" tabindex="-1" data-desc="desc.history"><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg><span data-i18n="tab.history"></span></button>
    <button type="button" role="tab" id="t-watch" aria-controls="p-watch" aria-selected="false" tabindex="-1" data-desc="desc.watch"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg><span data-i18n="tab.watch"></span></button>
    <p class="nav-group" role="presentation" data-i18n="navg.system"></p>
    <button type="button" role="tab" id="t-ileri" aria-controls="p-ileri" aria-selected="false" tabindex="-1" data-desc="desc.advanced"><svg class="ic" aria-hidden="true"><use href="#i-cog"/></svg><span data-i18n="tab.advanced"></span></button>
  </nav>
</aside>

<main id="main">
  <header class="top">
    <div class="grow">
      <h2 id="pane-title" class="pane-title"></h2>
      <p id="pane-desc" class="pane-desc"></p>
    </div>
    <span id="saved" class="saved" role="status" aria-live="polite"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg><span id="saved-text" data-i18n="saved"></span></span>
  </header>

  <div class="content">
  <p id="error" class="banner err" role="alert" hidden></p>

  <section id="upd-banner" class="upd-banner" role="status" hidden>
    <span class="tile accent"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></span>
    <p id="upd-banner-text" class="grow"></p>
    <button type="button" id="upd-banner-get" class="btn primary sm"><span data-i18n="upd.get"></span><svg class="ic" aria-hidden="true"><use href="#i-external"/></svg></button>
    <button type="button" id="upd-banner-x" class="iconbtn" data-i18n-attr="aria-label:upd.dismiss;title:upd.dismiss"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </section>

  <section id="ff-notice" class="notice" aria-labelledby="h-notice" hidden>
    <span class="tile accent"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></span>
    <div class="grow">
      <h2 id="h-notice" data-i18n="ffn.title"></h2>
      <p data-i18n="ffn.body"></p>
      <button type="button" id="ff-notice-ok" class="btn primary sm" data-i18n="ffn.ok"></button>
    </div>
  </section>

  <!-- General -->
  <section id="p-genel" class="pane on" role="tabpanel" aria-labelledby="t-genel" tabindex="-1">
    <div class="card">
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg></span>
        <div class="grow">
          <span id="l-lang" class="label" data-i18n="lang.label"></span>
          <p class="desc" data-i18n="lang.desc"></p>
        </div>
        <div class="seg seg-sm" role="radiogroup" aria-labelledby="l-lang">
          <span class="seg-thumb" aria-hidden="true"></span>
          <label><input type="radio" name="lang" value="en"><span lang="en">English</span></label>
          <label><input type="radio" name="lang" value="tr"><span lang="tr">Türkçe</span></label>
        </div>
      </div>
      <div class="row">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-power"/></svg></span>
        <div class="grow">
          <label for="autostart" class="label" data-i18n="autostart.label"></label>
          <p class="desc" id="d-autostart" data-i18n="autostart.desc"></p>
        </div>
        <input type="checkbox" id="autostart" class="switch" role="switch" aria-describedby="d-autostart">
      </div>
    </div>
    <div class="group">
      <h2 class="group-title" data-i18n="upd.title"></h2>
      <div class="card">
        <div class="row">
          <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg></span>
          <div class="grow">
            <label for="upd-sw" class="label" data-i18n="upd.auto"></label>
            <p class="desc" id="d-upd" data-i18n="upd.auto_desc"></p>
          </div>
          <input type="checkbox" id="upd-sw" class="switch" role="switch" aria-describedby="d-upd">
        </div>
        <div class="row">
          <span class="tile upd-tile" id="upd-tile"><svg class="ic" aria-hidden="true"><use id="upd-ic" href="#i-retry"/></svg></span>
          <div class="grow">
            <span class="label" data-i18n="upd.now_label"></span>
            <p id="upd-result" class="desc upd-result" role="status" aria-live="polite" data-i18n="upd.never"></p>
          </div>
          <button type="button" id="upd-open" class="btn primary sm" hidden><span data-i18n="upd.get"></span><svg class="ic" aria-hidden="true"><use href="#i-external"/></svg></button>
          <button type="button" id="upd-check" class="btn sm" data-i18n="upd.check"></button>
        </div>
      </div>
    </div>
    <p class="aside" data-i18n-html="general.aside"></p>
  </section>

  <!-- Formats -->
  <section id="p-bicim" class="pane" role="tabpanel" aria-labelledby="t-bicim" tabindex="-1" hidden>
    <div class="group">
      <h2 class="group-title" id="h-profiles" data-i18n="fmt.profiles"></h2>
      <div class="card">
        <div id="profiles" class="profiles" role="group" aria-labelledby="h-profiles"></div>
        <p id="p-hint" class="foot hint" role="status" aria-live="polite" hidden></p>
      </div>
    </div>
    <div class="group">
      <h2 class="group-title" id="h-targets" data-i18n="fmt.targets"></h2>
      <div class="card">
        <div id="targets" class="kinds" aria-labelledby="h-targets"></div>
        <p id="t-hint" class="foot hint" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div class="group">
      <h2 class="group-title" id="h-sources" data-i18n="fmt.sources"></h2>
      <div class="card">
        <div id="sources" class="kinds" aria-labelledby="h-sources"></div>
        <p id="s-hint" class="foot hint" role="status" aria-live="polite"></p>
      </div>
    </div>
    <p id="cat-err" class="banner err" role="alert" hidden></p>
  </section>

  <!-- Presets -->
  <section id="p-preset" class="pane" role="tabpanel" aria-labelledby="t-preset" tabindex="-1" hidden>
    <div class="lead-row">
      <p class="aside" data-i18n="pr.intro"></p>
      <button type="button" id="pr-new" class="btn primary sm"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="pr.new"></span></button>
    </div>
    <p id="pr-off" class="banner warn" role="note" hidden><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg><span><span data-i18n="pr.menu_off"></span> <button type="button" class="link" data-goto="t-menu" data-i18n="pr.menu_off_link"></button></span></p>
    <p id="pr-err" class="banner err" role="alert" hidden></p>
    <div class="group">
      <h2 class="group-title" data-i18n="pr.builtin"></h2>
      <div id="pr-builtin" class="plist"></div>
    </div>
    <div class="group">
      <h2 class="group-title" data-i18n="pr.custom"></h2>
      <div id="pr-custom" class="plist"></div>
      <div id="pr-empty" class="empty sm" hidden>
        <p data-i18n="pr.empty"></p>
      </div>
    </div>
  </section>

  <!-- Output -->
  <section id="p-cikti" class="pane" role="tabpanel" aria-labelledby="t-cikti" tabindex="-1" hidden>
    <div class="card">
      <div class="row top-align">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-text"/></svg></span>
        <div class="grow">
          <label for="tpl" class="label" data-i18n="out.name"></label>
          <p class="desc" id="d-tpl" data-i18n="out.name_desc"></p>
          <input type="text" id="tpl" class="field" spellcheck="false" autocomplete="off" maxlength="100" aria-describedby="d-tpl tpl-msg tpl-ex">
          <div class="tokens" role="group" data-i18n-attr="aria-label:out.tags">
            <button type="button" class="token" data-token="{name}"><code>{name}</code><span data-i18n="tok.name"></span></button>
            <button type="button" class="token" data-token="{format}"><code>{format}</code><span data-i18n="tok.format"></span></button>
            <button type="button" class="token" data-token="{date}"><code>{date}</code><span data-i18n="tok.date"></span></button>
          </div>
          <p id="tpl-ex" class="example" aria-live="polite"><span class="ex-src" data-i18n="tpl.example_src"></span><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg><span id="tpl-out" class="ex-out"></span></p>
          <p id="tpl-msg" class="field-msg" role="alert"></p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="row top-align" role="radiogroup" aria-labelledby="l-dir">
        <span class="tile"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg></span>
        <div class="grow">
          <span id="l-dir" class="label" data-i18n="out.where"></span>
          <div class="choices">

        <label for="pd-name" class="f-label" data-i18n="pd.name"></label>
        <input type="text" id="pd-name" class="field plain" maxlength="40" autocomplete="off" aria-describedby="pd-name-msg" data-i18n-attr="placeholder:pd.name_ph">
        <p id="pd-name-msg" class="field-msg" role="alert"></p>
      </div>
      <div class="f">
        <span id="l-pd-kinds" class="f-label" data-i18n="pd.kinds"></span>
        <div id="pd-kinds" class="chips kind-chips" role="group" aria-labelledby="l-pd-kinds" aria-describedby="pd-kinds-msg"></div>
        <p id="pd-kinds-msg" class="field-msg" role="alert"></p>
      </div>
      <div class="f two">
        <div>
          <label for="pd-target" class="f-label" data-i18n="pd.target"></label>
          <span class="select full"><select id="pd-target"></select><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg></span>
        </div>
        <div id="pd-vt-wrap">
          <label for="pd-vtarget" class="f-label" data-i18n="pd.vtarget"></label>
          <span class="select full"><select id="pd-vtarget"></select><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg></span>
        </div>
      </div>
      <div class="f">
        <span id="l-pd-resize" class="f-label" data-i18n="pd.resize"></span>
        <div class="seg seg-4" role="radiogroup" aria-labelledby="l-pd-resize">
          <span class="seg-thumb" aria-hidden="true"></span>
          <label><input type="radio" name="pd-resize" value="none"><span data-i18n="pd.rs_none"></span></label>
          <label><input type="radio" name="pd-resize" value="max_edge"><span data-i18n="pd.rs_edge"></span></label>
          <label><input type="radio" name="pd-resize" value="percent"><span data-i18n="pd.rs_pct"></span></label>
          <label><input type="radio" name="pd-resize" value="exact"><span data-i18n="pd.rs_exact"></span></label>
        </div>
        <div id="pd-rs-edge" class="inline-f" hidden>
          <label for="pd-edge" data-i18n="pd.edge"></label>
          <span class="num"><input type="number" id="pd-edge" class="field plain" min="1" max="16384" step="1"><span>px</span></span>
        </div>
        <div id="pd-rs-pct" class="inline-f" hidden>
          <label for="pd-pct" data-i18n="pd.pct"></label>
          <span class="num"><input type="number" id="pd-pct" class="field plain" min="1" max="400" step="1"><span>%</span></span>
        </div>
        <div id="pd-rs-exact" class="inline-f" hidden>
          <span class="num"><input type="number" id="pd-w" class="field plain" min="1" max="16384" step="1" data-i18n-attr="aria-label:pd.w"><span>px</span></span>
          <span class="times" aria-hidden="true">×</span>
          <span class="num"><input type="number" id="pd-h" class="field plain" min="1" max="16384" step="1" data-i18n-attr="aria-label:pd.h"><span>px</span></span>
          <span class="select"><select id="pd-fit" data-i18n-attr="aria-label:pd.fit">
            <option value="contain" data-i18n="fit.contain"></option>
            <option value="cover" data-i18n="fit.cover"></option>
            <option value="stretch" data-i18n="fit.stretch"></option>
          </select><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg></span>
        </div>
        <p id="pd-rs-msg" class="field-msg" role="alert"></p>
      </div>
      <div class="opts card">
        <div class="row">
          <div class="grow">
            <label for="pd-strip" class="label" data-i18n="pd.strip"></label>
            <p class="desc" data-i18n="pd.strip_desc"></p>
          </div>
          <input type="checkbox" id="pd-strip" class="switch" role="switch">
        </div>
        <div class="row">
          <div class="grow">
            <label for="pd-max-on" class="label" data-i18n="pd.max"></label>
            <p class="desc" data-i18n="pd.max_desc"></p>
          </div>
          <span id="pd-max-wrap" class="num-unit" hidden>
            <input type="number" id="pd-max" class="field plain" min="1" step="any" data-i18n-attr="aria-label:pd.max">
            <span class="select"><select id="pd-unit" data-i18n-attr="aria-label:pd.unit"><option value="1000">KB</option><option value="1000000">MB</option></select><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg></span>
          </span>
          <input type="checkbox" id="pd-max-on" class="switch" role="switch">
        </div>
        <div class="row top-align">
          <div class="grow q">
            <div class="label-line"><label for="pd-q-on" class="label" data-i18n="pd.q"></label><output for="pd-q" class="val" id="pd-q-val"></output></div>
            <input type="range" id="pd-q" class="slider" min="1" max="100" step="1" data-i18n-attr="aria-label:pd.q" hidden>
          </div>
          <input type="checkbox" id="pd-q-on" class="switch" role="switch">
        </div>
        <div class="row top-align">
          <div class="grow q">
            <div class="label-line"><label for="pd-v-on" class="label" data-i18n="pd.v"></label><output for="pd-v" class="val" id="pd-v-val"></output></div>
            <input type="range" id="pd-v" class="slider" min="1" max="30" step="1" data-i18n-attr="aria-label:pd.v" hidden>
          </div>
          <input type="checkbox" id="pd-v-on" class="switch" role="switch">
        </div>
      </div>
      <p id="pd-opt-msg" class="field-msg" role="alert"></p>
    </div>
    <footer class="dlg-foot">
      <p class="summary"><svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg><span id="pd-sum"></span></p>
      <p id="pd-err" class="field-msg" role="alert"></p>
      <div class="actions end">
        <button type="button" class="btn" data-close data-i18n="dlg.cancel"></button>
        <button type="submit" id="pd-save" class="btn primary" data-i18n="dlg.save"></button>
      </div>
    </footer>
  </form>
</div>

<!-- watch rule editor -->
<div id="wd" class="backdrop" hidden>
  <form id="wd-form" class="dialog sheet-dlg" role="dialog" aria-modal="true" aria-labelledby="wd-title" novalidate>
    <header class="dlg-head">
      <span class="tile accent"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg></span>
      <h2 id="wd-title" class="grow"></h2>
      <button type="button" class="iconbtn" data-close data-i18n-attr="aria-label:dlg.close;title:dlg.close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </header>
    <div class="dlg-body">
      <div class="f">
        <span id="l-wd-folder" class="f-label" data-i18n="wd.folder"></span>
        <div class="pick-line">
          <p id="wd-folder" class="path grow" aria-labelledby="l-wd-folder"></p>
          <button type="button" id="wd-pick" class="btn sm"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg><span data-i18n="out.pick"></span></button>
        </div>
        <p id="wd-folder-msg" class="field-msg" role="alert"></p>
      </div>
      <div class="opts card">
        <div class="row">
          <div class="grow">
            <label for="wd-rec" class="label" data-i18n="wd.recursive"></label>
            <p class="desc" data-i18n="wd.recursive_desc"></p>
          </div>
          <input type="checkbox" id="wd-rec" class="switch" role="switch">
        </div>
        <div class="row top-align">
          <div class="grow">
            <label for="wd-all" class="label" data-i18n="wd.all"></label>
            <p class="desc" data-i18n="wd.all_desc"></p>
            <div id="wd-exts" class="chips small" role="group" data-i18n-attr="aria-label:wd.types" hidden></div>
            <p id="wd-exts-msg" class="field-msg" role="alert"></p>
          </div>
          <input type="checkbox" id="wd-all" class="switch" role="switch">
        </div>
      </div>
      <div class="f">
        <span id="l-wd-act" class="f-label" data-i18n="wd.action"></span>
        <div class="seg seg-sm wide" role="radiogroup" aria-labelledby="l-wd-act">
          <span class="seg-thumb" aria-hidden="true"></span>
          <label><input type="radio" name="wd-act" value="preset"><span data-i18n="wd.act_preset"></span></label>
          <label><input type="radio" name="wd-act" value="target"><span data-i18n="wd.act_target"></span></label>
        </div>
        <span class="select full mt"><select id="wd-preset" data-i18n-attr="aria-label:wd.act_preset"></select><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg></span>
        <span class="select full mt"><select id="wd-target" data-i18n-attr="aria-label:wd.act_target"></select><svg class="ic" aria-hidden="true"><use href="#i-chevron"/></svg></span>
      </div>
      <div class="f" role="radiogroup" aria-labelledby="l-wd-out">
        <span id="l-wd-out" class="f-label" data-i18n="wd.out"></span>
        <div class="choices tight">
          <label class="choice"><input type="radio" name="wd-out" value="same"><span data-i18n="wd.out_same"></span></label>
          <div class="choice">
            <label><input type="radio" name="wd-out" value="sub"><span data-i18n="wd.out_sub"></span></label>
            <input type="text" id="wd-sub" class="field plain short" maxlength="60" spellcheck="false" autocomplete="off" data-i18n-attr="aria-label:wd.out_sub_name">
          </div>
          <div class="choice">
            <label><input type="radio" name="wd-out" value="fixed"><span data-i18n="wd.out_fixed"></span></label>
            <button type="button" id="wd-opick" class="btn sm" data-i18n="out.pick"></button>
          </div>
        </div>
        <p id="wd-opath" class="path" hidden></p>
        <p id="wd-out-msg" class="field-msg" role="alert"></p>
      </div>
    </div>
    <footer class="dlg-foot">
      <p id="wd-err" class="field-msg" role="alert"></p>
      <div class="actions end">
        <button type="button" class="btn" data-close data-i18n="dlg.cancel"></button>
        <button type="submit" id="wd-save" class="btn primary" data-i18n="dlg.save"></button>
      </div>
    </footer>
  </form>
</div>

<!-- open-source licenses -->
<div id="ld" class="backdrop" hidden>
  <div class="dialog sheet-dlg lic-dlg" role="dialog" aria-modal="true" aria-labelledby="ld-title">
    <header class="dlg-head">
      <span class="tile accent"><svg class="ic" aria-hidden="true"><use href="#i-doc"/></svg></span>
      <h2 id="ld-title" class="grow" data-i18n="ld.title"></h2>
      <button type="button" class="iconbtn" data-close data-i18n-attr="aria-label:dlg.close;title:dlg.close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </header>
    <div class="lic-tools">
      <span class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="ld-q" class="field plain" spellcheck="false" autocomplete="off" data-i18n-attr="placeholder:ld.search;aria-label:ld.search" aria-describedby="ld-count"></span>
      <span id="ld-count" class="count" role="status" aria-live="polite"></span>
      <button type="button" id="ld-copy" class="btn sm"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="ld.copy"></span></button>
    </div>
    <div id="ld-body" class="dlg-body lic-body" tabindex="0" aria-labelledby="ld-title"></div>
  </div>
</div>

<!-- shown while files are dragged over the window -->
<div id="dz" class="dropzone" aria-hidden="true">
  <div class="dz-frame">
    <svg class="dz-art" viewBox="0 0 120 96">
      <path class="e-sheet back" d="M36 22h24l11 11v42a3 3 0 0 1-3 3H36a3 3 0 0 1-3-3V25a3 3 0 0 1 3-3z"/>
      <path class="e-sheet" d="M48 14h26l12 12v46a3 3 0 0 1-3 3H48a3 3 0 0 1-3-3V17a3 3 0 0 1 3-3z"/>
      <path class="e-fold" d="M74 14v9a3 3 0 0 0 3 3h9"/>
      <path class="dz-arrow" d="M65 36v22m-8-8 8 8 8-8"/>
    </svg>
    <p class="dz-title" data-i18n="dz.title"></p>
    <p class="dz-sub" data-i18n="dz.sub"></p>
  </div>
</div>
</body>
</html>
