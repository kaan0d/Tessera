<!doctype html>
<html lang="en" class="prog-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>new-app</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="progress.js" defer></script>
</head>
<body class="prog" data-corner="top_right">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2.2h7.4a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
</svg>
<div id="card" class="p-card">
  <header id="head" class="p-head">
    <!-- placeholder brand mark: keep in sync with index.html -->
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <defs>
        <linearGradient id="mark-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="mark-a"/><stop offset="1" class="mark-b"/></linearGradient>
        <clipPath id="mark-c"><path d="M14 8.5h9.5l5.5 5.5v16a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2v-19.5a2 2 0 0 1 2-2z"/></clipPath>
      </defs>
      <rect width="40" height="40" rx="11" fill="url(#mark-g)"/>
      <path class="mark-sheet" d="M14 8.5h9.5l5.5 5.5v16a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2v-19.5a2 2 0 0 1 2-2z"/>
      <rect class="mark-ink" x="10" y="20.5" width="22" height="13" clip-path="url(#mark-c)"/>
      <path class="mark-fold" d="M23.5 8.5V12a2 2 0 0 0 2 2H29"/>
    </svg>
    <div class="grow">
      <h1 id="p-title" class="p-title" data-i18n="p.running"></h1>
      <p id="p-sub" class="p-sub"></p>
    </div>
    <p class="p-pct" aria-hidden="true"><small class="pre">%</small><span id="p-pct">0</span><small class="post">%</small></p>
    <div id="p-bar" class="bar" aria-hidden="true"><span></span></div>
  </header>
  <ul id="jobs" class="jobs" data-i18n-attr="aria-label:p.list"></ul>
  <span id="p-timer" class="p-timer" aria-hidden="true"></span>
</div>
<p id="announce" class="sprite" role="status" aria-live="polite"></p>
</body>
</html>
