<!doctype html>
<html lang="en" class="prog-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="progress.js" defer></script>
</head>
<body class="prog" data-corner="top_right">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4.5 9.5 9 5"/><path d="M5 9.5h9a5.5 5.5 0 0 1 0 11h-3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2.2h7.4a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
</svg>
<div id="card" class="p-card">
  <header id="head" class="p-head">
    <svg class="mark-tiles" viewBox="0 0 36 36" aria-hidden="true"><rect class="m0" x="0.0" y="0.0" width="9" height="9" rx="1.3"/><rect class="m0" x="0.0" y="13.5" width="9" height="9" rx="1.3"/><rect class="m0" x="0.0" y="27.0" width="9" height="9" rx="1.3"/><rect class="m1" x="13.5" y="0.0" width="9" height="9" rx="3.4"/><rect class="m1" x="13.5" y="13.5" width="9" height="9" rx="3.4"/><rect class="m1" x="13.5" y="27.0" width="9" height="9" rx="3.4"/><rect class="m2" x="27.0" y="0.0" width="9" height="9" rx="4.5"/><rect class="m2" x="27.0" y="13.5" width="9" height="9" rx="4.5"/><rect class="m2" x="27.0" y="27.0" width="9" height="9" rx="4.5"/></svg>
    <div class="grow">
      <h1 id="p-title" class="p-title" data-i18n="p.running"></h1>
      <p id="p-sub" class="p-sub"></p>
    </div>
    <p class="p-pct" aria-hidden="true"><small class="pre">%</small><span id="p-pct">0</span><small class="post">%</small></p>
    <div id="p-bar" class="bar" aria-hidden="true"><span></span></div>
  </header>
  <ul id="jobs" class="jobs" data-i18n-attr="aria-label:p.list"></ul>
  <span id="p-timer" class="p-timer" aria-hidden="true"></span>
</div>
<p id="announce" class="sprite" role="status" aria-live="polite"></p>
</body>
</html>
